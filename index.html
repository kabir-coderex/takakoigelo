<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Budget Tracker</title>
<meta name="theme-color" content="#0c0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e14;--surface:#13161f;--surface2:#1a1e2b;--surface3:#21263a;
  --border:#252a3a;--border2:#2f3650;
  --accent:#6c8fff;--accent2:#a78bfa;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;
  --text:#dde1f0;--muted:#5a6180;--muted2:#8892b0;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono','SF Mono','Fira Code',ui-monospace,monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px);-webkit-text-size-adjust:100%}
button,select,input,textarea{touch-action:manipulation}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:8px}
.header-left{flex:1;min-width:0}
.header-title{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hbtn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);cursor:pointer;font-family:var(--font);font-size:11px;font-weight:500;padding:8px 12px;min-height:36px;white-space:nowrap;transition:all .2s;flex-shrink:0}
.hbtn:hover,.hbtn:active{border-color:var(--accent);color:var(--accent)}

/* MONTH SELECTOR BAR */
.month-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.month-bar::-webkit-scrollbar{display:none}
.month-chip{background:var(--surface2);border:1px solid var(--border);border-radius:99px;color:var(--muted2);cursor:pointer;font-size:12px;font-weight:500;padding:6px 14px;min-height:34px;white-space:nowrap;transition:all .2s;flex-shrink:0}
.month-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.month-chip:active:not(.active){border-color:var(--border2);color:var(--text)}
.add-month-btn{background:none;border:1px dashed var(--border2);border-radius:99px;color:var(--muted);cursor:pointer;font-size:12px;padding:6px 14px;min-height:34px;white-space:nowrap;flex-shrink:0;transition:all .2s}
.workspace-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none}
.workspace-bar::-webkit-scrollbar{display:none}.workspace-chip{background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted2);cursor:pointer;font-size:11px;padding:6px 11px;min-height:32px;white-space:nowrap}.workspace-chip.active{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
.workspace-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}.workspace-card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.workspace-card-name{font-size:13px;font-weight:600}.workspace-card-meta{font-size:11px;color:var(--muted2);margin-top:6px}

.wrap{max-width:480px;margin:0 auto;padding:0 16px}

/* ALERT */
.alert-banner{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:12px;color:var(--red);display:none}
.alert-banner.show{display:block}
.backup-banner{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:12px;color:var(--amber);display:flex;align-items:center;justify-content:space-between;gap:10px}
.backup-banner .btn-outline{color:var(--amber);border-color:rgba(251,191,36,.35)}
.safety-screen{max-width:480px;margin:24px auto;padding:0 16px}
.safety-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:20px;margin-bottom:12px}
.safety-card h2{font-size:18px;margin-bottom:8px}.safety-card p{font-size:13px;color:var(--muted2);line-height:1.55;margin-bottom:12px}
.safety-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.safety-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}.safety-stat strong{display:block;font-family:var(--mono);font-size:16px;color:var(--text)}.safety-stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.safety-check{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted2);margin:12px 0;line-height:1.4}.safety-check input{margin-top:2px}
.error-details{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--red);margin:10px 0}
.storage-issue{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;background:var(--surface2);border:1px solid var(--red);border-radius:12px;padding:12px;z-index:1200;display:none;box-shadow:0 12px 36px rgba(0,0,0,.45)}
.storage-issue.show{display:block}.storage-issue p{font-size:12px;color:var(--text);line-height:1.4;margin-bottom:9px}.storage-issue-actions{display:flex;gap:6px;flex-wrap:wrap}
.restore-warnings{font-size:11px;color:var(--amber);line-height:1.5;margin-top:10px}
.recovery-item{padding:9px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}.recovery-item:last-child{border-bottom:none}.recovery-meta{font-size:11px;color:var(--muted2);line-height:1.4}

/* HERO */
.hero{margin:12px 0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(108,143,255,.07) 0%,transparent 70%)}
.hero-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hero-amount{font-family:var(--mono);font-size:36px;font-weight:500;line-height:1;margin:6px 0 3px;transition:color .4s;word-break:break-all}
.hero-amount.safe{color:var(--green)}.hero-amount.warn{color:var(--amber)}.hero-amount.danger{color:var(--red)}
.hero-sub{font-size:12px;color:var(--muted2)}
.hero-bar-bg{background:var(--border);border-radius:99px;height:5px;margin-top:14px;overflow:hidden}
.hero-bar{height:100%;border-radius:99px;transition:width .5s ease,background .4s}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px}
.sc-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.sc-val{font-family:var(--mono);font-size:17px;font-weight:500}
.sc-val.red{color:var(--red)}.sc-val.amber{color:var(--amber)}.sc-val.green{color:var(--green)}.sc-val.accent{color:var(--accent)}
.sc-sub{font-size:10px;color:var(--muted);margin-top:3px}

/* TABS */
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.tab{flex:1;background:none;border:none;border-radius:7px;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:11px;font-weight:500;padding:10px 2px;min-height:38px;transition:background .2s,color .2s}
.tab.active{background:var(--accent);color:#fff}
.tab-panel{display:none}.tab-panel.active{display:block}
.sec-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 8px}

/* ADD FORM */
.add-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.frow{display:flex;gap:8px;margin-bottom:8px}.frow:last-child{margin-bottom:0}
select,input[type=text],input[type=number],input[type=month],input[type=date]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:16px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s;min-height:44px;color-scheme:dark}
select:focus,input:focus{border-color:var(--accent)}
select option{background:#13161f}
.btn{background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;padding:10px 16px;min-height:44px;white-space:nowrap;transition:opacity .2s}
.btn:active{opacity:.75}
.btn-sm{font-size:11px;padding:7px 12px;min-height:34px}
.btn-ghost{background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted2);cursor:pointer;font-family:var(--font);font-size:11px;padding:7px 12px;min-height:34px;transition:all .2s}
.btn-ghost:active{border-color:var(--red);color:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted2);cursor:pointer;font-family:var(--font);font-size:11px;padding:7px 12px;min-height:34px;transition:all .2s}
.btn-outline:active{border-color:var(--accent);color:var(--accent)}

/* CATEGORY ROWS */
.cat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cat-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;transition:border-color .2s}
.cat-row:active,.cat-row.open{border-color:var(--border2)}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-right{text-align:right;flex-shrink:0}
.cat-spent{font-family:var(--mono);font-size:13px}
.cat-of{font-size:10px;color:var(--muted);margin-top:1px}
.cat-pbar-bg{background:var(--border);border-radius:99px;height:3px;margin-top:9px;overflow:hidden}
.cat-pbar{height:100%;border-radius:99px;transition:width .4s,background .3s}
.exp-list{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;display:none}
.cat-row.open .exp-list{display:block}
.exp-item{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.exp-item:last-child{border-bottom:none}
.exp-desc{font-size:12px}.exp-date{font-size:10px;color:var(--muted);margin-top:2px}
.exp-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.exp-amt{font-family:var(--mono);font-size:12px;color:var(--red)}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;opacity:1;padding:6px 8px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;transition:color .2s}
.del-btn:active{color:var(--red)}
.edit-exp-btn{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px;padding:6px 8px;min-width:32px;min-height:32px}
.edit-exp-btn:active{color:var(--accent)}
.date-review{color:var(--amber)}
.exp-empty{font-size:11px;color:var(--muted);text-align:center;padding:8px 0}

/* ANALYTICS */
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ana-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px}
.ana-card.full{grid-column:1/-1}
.ana-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.ana-val{font-family:var(--mono);font-size:18px;font-weight:500;word-break:break-all}
.ana-sub{font-size:11px;color:var(--muted2);margin-top:3px}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bc-row{display:flex;align-items:center;gap:6px}
.bc-label{font-size:10px;color:var(--muted2);width:54px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-bar-bg{flex:1;background:var(--border);border-radius:99px;height:7px;overflow:hidden}
.bc-bar{height:100%;border-radius:99px;transition:width .5s ease}
.bc-val{font-family:var(--mono);font-size:10px;color:var(--muted2);width:48px;flex-shrink:0;text-align:right}
.spark-wrap{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:4px}
.spark-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px;cursor:default;position:relative}
.spark-dates{display:flex;gap:2px;margin-top:3px}
.spark-date{flex:1;font-size:8px;color:var(--muted);text-align:center;overflow:hidden}
.over-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.over-item:last-child{border-bottom:none}
.over-name{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.over-badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px;font-weight:500;flex-shrink:0;white-space:nowrap}
.over-badge.over{background:rgba(248,113,113,.12);color:var(--red)}
.over-badge.good{background:rgba(52,211,153,.12);color:var(--green)}
.top-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.top-item:last-child{border-bottom:none}
.top-rank{font-family:var(--mono);font-size:11px;color:var(--muted);width:18px}
.top-info{flex:1;padding:0 8px;min-width:0;overflow:hidden}
.top-desc{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-cat{font-size:10px;color:var(--muted);margin-top:1px}
.top-amt{font-family:var(--mono);font-size:13px;color:var(--red);flex-shrink:0}

/* HISTORY */
.hist-month{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hist-name{font-size:14px;font-weight:600}
.hist-spent{font-family:var(--mono);font-size:13px;flex-shrink:0}
.hist-bar-bg{background:var(--border);border-radius:99px;height:3px;margin-top:10px;overflow:hidden}
.hist-bar{height:100%;border-radius:99px}
.hist-cats{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.hist-cat-chip{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px 9px;color:var(--muted2)}

/* LOG */
.log-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;align-items:flex-start;justify-content:space-between;padding:11px 13px;margin-bottom:7px;gap:8px}
.log-cat{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.log-desc{font-size:13px}.log-date{font-size:10px;color:var(--muted);margin-top:2px}
.log-r{display:flex;align-items:center;gap:4px;flex-shrink:0}
.log-amt{font-family:var(--mono);font-size:14px;color:var(--red);font-weight:500}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:32px 0}

/* SETTINGS / CATEGORY MGMT */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.settings-section h3{font-size:12px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat-mgmt-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);min-height:44px}
.cat-mgmt-item:last-child{border-bottom:none}
.drag-handle{color:var(--muted);cursor:grab;font-size:16px;padding:4px;user-select:none;min-width:24px;text-align:center}
.cat-mgmt-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-mgmt-budget{font-family:var(--mono);font-size:12px;color:var(--accent);flex-shrink:0}
.edit-btn,.del-cat-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px 8px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;transition:color .2s}
.edit-btn:active{color:var(--accent)}
.del-cat-btn:active{color:var(--red)}
.danger-zone{margin-top:10px;border:1px solid var(--border);border-radius:12px;padding:14px}
.danger-zone p{font-size:12px;color:var(--muted);margin-bottom:8px}
.btn-danger{background:transparent;border:1px solid var(--red);border-radius:8px;color:var(--red);cursor:pointer;font-family:var(--font);font-size:12px;padding:8px 14px;min-height:38px;transition:background .2s}
.btn-danger:active{background:rgba(248,113,113,.1)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px}
.modal .frow{margin-bottom:10px}.modal .frow:last-child{margin-bottom:0}
.modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

/* TOAST */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);border:1px solid var(--border2);border-radius:99px;padding:10px 20px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;z-index:999;max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.actionable{pointer-events:auto;display:flex;align-items:center;gap:12px;white-space:normal}
.toast-action{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 0}
.archived-badge{font-size:9px;text-transform:uppercase;color:var(--amber);border:1px solid rgba(251,191,36,.3);border-radius:99px;padding:2px 6px;margin-left:5px}

/* DRAGGING */
.cat-mgmt-item.dragging{opacity:.4}
.cat-mgmt-item.drag-over{border-top:2px solid var(--accent)}

/* RESPONSIVE — very small screens */
@media(max-width:359px){
  .hero-amount{font-size:28px}
  .ana-grid{grid-template-columns:1fr}
  .ana-card.full{grid-column:1}
  .stat-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-title" id="headerTitle">Budget Tracker</div>
    <div class="header-sub" id="headerSub">Select a month</div>
  </div>
  <button class="hbtn" onclick="switchMainTab('settings')" id="settingsBtn">⚙</button>
</header>

<div class="month-bar" id="monthBar">
  <button class="add-month-btn" onclick="showNewMonthModal()">+ New Month</button>
</div>
<div class="workspace-bar" id="workspaceBar"></div>

<!-- Modal: Edit Expense -->
<div class="modal-overlay" id="editExpenseModal">
  <div class="modal">
    <h3>Edit Expense</h3>
    <div class="frow"><input type="text" id="editExpenseDesc" placeholder="Description" /></div>
    <div class="frow"><input type="number" id="editExpenseAmount" placeholder="Amount (BDT)" min="0.01" step="any" /></div>
    <div class="frow"><input type="date" id="editExpenseDate" onchange="refreshEditExpenseCategories()" /></div>
    <div class="frow"><select id="editExpenseWorkspace" onchange="refreshEditExpenseCategories()"></select></div>
    <div class="frow"><select id="editExpenseCategory"></select></div>
    <div id="editExpenseNote" style="font-size:11px;color:var(--amber);line-height:1.45"></div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal('editExpenseModal')">Cancel</button>
      <button class="btn btn-sm" onclick="saveExpenseEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Modal: Workspace -->
<div class="modal-overlay" id="workspaceModal">
  <div class="modal">
    <h3 id="workspaceModalTitle">New Workspace</h3>
    <div class="frow"><input type="text" id="workspaceName" placeholder="Workspace name" /></div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal('workspaceModal')">Cancel</button>
      <button class="btn btn-sm" onclick="saveWorkspace()">Save</button>
    </div>
  </div>
</div>

<div class="storage-issue" id="storageIssue" role="alert">
  <p id="storageIssueText"></p>
  <div class="storage-issue-actions">
    <button class="btn-outline btn-sm" id="retrySaveBtn" onclick="retryPendingSave()">Retry save</button>
    <button class="btn-outline btn-sm" id="exportUnsavedBtn" onclick="exportUnsavedData()">Export unsaved copy</button>
    <button class="btn-danger" id="reloadDataBtn" onclick="reloadActiveData()">Reload latest</button>
    <button class="btn-ghost" onclick="hideStorageIssue()">Close</button>
  </div>

<script src="storage.js"></script>
<script>
const CAT_COLORS  = ["#6c8fff","#a78bfa","#34d399","#fbbf24","#f472b6","#38bdf8","#fb923c","#4ade80","#e879f9","#22d3ee","#f87171","#a3e635"];

// ─── STATE ───────────────────────────────────────────────────────
let months = {};        // { [key]: { name, categories, expenses } }
let globalCats = [];    // [{id,name,budget}]
let workspaces = [];
let activeWorkspaceId = 'workspace-existing';
let activeMonth = null; // key like '2026-07'
let storedActiveMonth = null; // Exact persisted value; may be invalid legacy data awaiting review
let currentTab = 'add';
let editCatId = null;
let editCatIsGlobal = false;
let dragSrcIdx = null;
let appSettings = { lastBackupAt: null, phase1Version: 1, transactionTrash: [] };
let loadedRevision = null;
let migrationState = null;
let pendingRestore = null;
let recoveryMode = false;
let recoveryState = null;
let staleDataDetected = false;
let editingExpense = null;
let editingWorkspaceId = null;
const storageAdapter = new BudgetStorage.Adapter(localStorage);

// ─── INIT ────────────────────────────────────────────────────────
async function init() {
  let result;
  try {
    result = await storageAdapter.bootstrapExclusive();
  } catch (error) {
    recoveryMode = true;
    recoveryState = { status: 'recovery_required', error, rawLegacy: null, activePointer: null };
    renderRecoveryScreen();
    return;
  }
  if (result.status === 'migration_required') {
    migrationState = result;
    renderMigrationGate();
    return;
  }
  if (result.status === 'recovery_required') {
    recoveryMode = true;
    recoveryState = result;
    renderRecoveryScreen();
    return;
  }
  loadEnvelope(result.envelope);
  renderMonthBar();
  renderWorkspaceBar();
  if (activeMonth) renderMonth();
  else renderEmpty();
}

function currentData() {
  appSettings.activeWorkspaceId = activeWorkspaceId;
  return { months, globalCats, workspaces, activeMonth: storedActiveMonth, settings: appSettings };
}

function loadEnvelope(envelope) {
  const data = JSON.parse(JSON.stringify(envelope.data));
  months = data.months;
  globalCats = data.globalCats;
  workspaces = data.workspaces || [];
  storedActiveMonth = data.activeMonth;
  activeMonth = storedActiveMonth;
  appSettings = data.settings || { lastBackupAt: null, phase1Version: 1, transactionTrash: [] };
  if (!Array.isArray(appSettings.transactionTrash)) appSettings.transactionTrash = [];
  activeWorkspaceId = appSettings.activeWorkspaceId || workspaces.find(workspace=>!workspace.archived)?.id || 'all';
  if(activeWorkspaceId!=='all'&&!workspaces.some(workspace=>workspace.id===activeWorkspaceId&&!workspace.archived)) activeWorkspaceId=workspaces.find(workspace=>!workspace.archived)?.id||'all';
  if (!activeMonth || !months[activeMonth]) activeMonth = Object.keys(months).sort()[0] || null;
  loadedRevision = envelope.revision;
  staleDataDetected = false;
  document.getElementById('settingsBtn').disabled = false;
  hideStorageIssue();
}

async function saveAll() {
  if (staleDataDetected) {
    const error = new Error('A newer dataset exists in another tab. Export this tab\'s unsaved copy or reload the latest data.');
    showStorageIssue(error.message);
    throw error;
  }
  try {
    const result = await storageAdapter.writeExclusive(currentData(), loadedRevision);
    loadedRevision = result.envelope.revision;
    hideStorageIssue();
    return true;
  } catch (error) {
    if (error.code === 'REVISION_CONFLICT') staleDataDetected = true;
    showStorageIssue(error.message || 'Data could not be saved. Your changes remain open for retry or export.');
    throw error;
  }
}

function deepCopy(x) { return JSON.parse(JSON.stringify(x)); }
function uid() { return 'c' + Date.now() + Math.random().toString(36).slice(2,6); }
function fmt(n) { const s = Math.round(Math.abs(n)).toLocaleString('en-IN'); return n < 0 ? '-৳' + s : '৳' + s; }
function h(value) { return String(value ?? '').replace(/[&<>"']/g, ch=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch])); }
function displayExpenseDate(expense) {
  if (BudgetStorage.isCalendarDate(expense.date)) return expense.date;
  return `${expense.legacyDate || 'Unknown date'} · review date`;
}
function selectedWorkspace() { return workspaces.find(workspace=>workspace.id===activeWorkspaceId)||null; }
function budgetFor(monthKey=activeMonth,workspaceId=activeWorkspaceId) { return months[monthKey]?.budgets?.[workspaceId]||null; }
function currentBudget() { return activeWorkspaceId==='all'?null:budgetFor(activeMonth,activeWorkspaceId); }
function templateCategories() { return selectedWorkspace()?.template||[]; }
function workspaceName(workspaceId) { return workspaces.find(workspace=>workspace.id===workspaceId)?.name||'Unknown workspace'; }
function createWorkspaceBudget(monthKey,workspaceId){
  const month=months[monthKey];const workspace=workspaces.find(item=>item.id===workspaceId);if(!month||!workspace)return null;
  if(!month.budgets)month.budgets={};if(month.budgets[workspaceId])return month.budgets[workspaceId];
  const earlier=Object.keys(months).filter(key=>key<monthKey&&months[key].budgets?.[workspaceId]).sort();
  const source=earlier.length?months[earlier[earlier.length-1]].budgets[workspaceId].categories:workspace.template;
  month.budgets[workspaceId]={categories:deepCopy(source.filter(category=>!category.archived)),expenses:[]};
  return month.budgets[workspaceId];
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.classList.remove('actionable');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function showUndoToast(msg, trashId) {
  const t = document.getElementById('toast');
  t.classList.add('actionable');
  t.replaceChildren();
  const label = document.createElement('span'); label.textContent = msg;
  const button = document.createElement('button'); button.className = 'toast-action'; button.textContent = 'Undo';
  button.onclick = ()=>restoreTrashItem(trashId);
  t.append(label, button); t.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show','actionable'); }, 6000);
}

function summaryHTML(summary) {
  return `<div class="safety-summary">
    <div class="safety-stat"><strong>${summary.months}</strong><span>Months</span></div>
    <div class="safety-stat"><strong>${summary.monthlyCategories}</strong><span>Monthly categories</span></div>
    <div class="safety-stat"><strong>${summary.globalCategories}</strong><span>Template categories</span></div>
    <div class="safety-stat"><strong>${summary.transactions}</strong><span>Transactions</span></div>
    <div class="safety-stat"><strong>${fmt(summary.totalAmount)}</strong><span>Total recorded</span></div>
  </div>`;
}

function renderMigrationGate() {
  document.getElementById('headerTitle').textContent = 'Safe data upgrade';
  document.getElementById('headerSub').textContent = 'Backup required before migration';
  document.getElementById('monthBar').style.display = 'none';
  document.getElementById('workspaceBar').style.display = 'none';
  document.getElementById('settingsBtn').disabled = true;
  document.getElementById('mainContent').innerHTML = `<div class="safety-screen">
    <div class="safety-card">
      <h2>Protect your existing records</h2>
      <p>This version uses safer, versioned storage. Your current data has been read without changing it. Download the pre-upgrade backup and verify that the file is available before continuing.</p>
      ${summaryHTML(migrationState.summary)}
      <button class="btn" id="preMigrationDownload" onclick="downloadPreMigrationBackup()">Download pre-upgrade backup</button>
      <label class="safety-check"><input type="checkbox" id="migrationVerified" onchange="updateMigrationButton()" disabled><span>I saved the backup and verified it on a separate test copy or profile.</span></label>
      <button class="btn" id="runMigrationBtn" onclick="completeMigration()" disabled>Upgrade safely</button>
      <p style="margin-top:12px;margin-bottom:0">The original browser keys and an exact raw snapshot will be retained after migration.</p>
    </div>
  </div>`;
}

function downloadPreMigrationBackup() {
  try {
    const backup = storageAdapter.createPreMigrationBackup(migrationState.data, migrationState.rawLegacy);
    downloadJSON(backup, `taka-koi-gelo-pre-upgrade-${new Date().toISOString().slice(0,10)}.json`);
    const checkbox = document.getElementById('migrationVerified');
    checkbox.disabled = false;
    document.getElementById('preMigrationDownload').textContent = 'Download again';
    showToast('Backup export started — verify the downloaded file');
  } catch (error) {
    showStorageIssue(error.message);
  }
}

function updateMigrationButton() {
  document.getElementById('runMigrationBtn').disabled = !document.getElementById('migrationVerified').checked;
}

async function completeMigration() {
  if (!document.getElementById('migrationVerified')?.checked) return;
  try {
    const result = await storageAdapter.migrateLegacyExclusive(migrationState.rawLegacy);
    migrationState = null;
    loadEnvelope(result.envelope);
    document.getElementById('monthBar').style.display = '';
    document.getElementById('workspaceBar').style.display = '';
    renderMonthBar();
    renderWorkspaceBar();
    if (activeMonth) renderMonth(); else renderEmpty();
    showToast('Data upgraded and verified ✓');
  } catch (error) {
    showStorageIssue(error.message);
  }
}

function renderRecoveryScreen() {
  const error = recoveryState.error || new Error('Stored data is unreadable');
  document.getElementById('headerTitle').textContent = 'Recovery required';
  document.getElementById('headerSub').textContent = 'Existing data was not modified';
  document.getElementById('monthBar').style.display = 'none';
  document.getElementById('workspaceBar').style.display = 'none';
  document.getElementById('settingsBtn').disabled = true;
  document.getElementById('mainContent').innerHTML = `<div class="safety-screen">
    <div class="safety-card">
      <h2>Your current data needs attention</h2>
      <p>The app found malformed or incomplete stored data. It did not replace it with an empty dataset. Export the raw recovery package before restoring a known-good backup.</p>
      <div class="error-details" id="recoveryError"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="exportRawRecovery()">Export raw recovery data</button>
        <button class="btn-outline" onclick="importJSON()">Restore valid backup</button>
      </div>
    </div>
  </div>`;
  document.getElementById('recoveryError').textContent = `${error.code || 'STORAGE_ERROR'}: ${error.message}`;
}

function exportRawRecovery() {
  const recovery = storageAdapter.exportRawRecovery(recoveryState?.rawLegacy, recoveryState?.error);
  downloadJSON(recovery, `taka-koi-gelo-raw-recovery-${new Date().toISOString().slice(0,10)}.json`);
  showToast('Raw recovery export started');
}

function showStorageIssue(message) {
  document.getElementById('storageIssueText').textContent = message;
  const hasActiveData = !recoveryMode && !migrationState && !!loadedRevision;
  document.getElementById('retrySaveBtn').style.display = hasActiveData ? '' : 'none';
  document.getElementById('exportUnsavedBtn').style.display = hasActiveData ? '' : 'none';
  document.getElementById('reloadDataBtn').style.display = hasActiveData ? '' : 'none';
  document.getElementById('storageIssue').classList.add('show');
}

function hideStorageIssue() {
  document.getElementById('storageIssue').classList.remove('show');
}

async function retryPendingSave() {
  if (recoveryMode || migrationState || !loadedRevision) return;
  try {
    await saveAll();
    showToast('Saved successfully ✓');
  } catch (_) {}
}

function exportUnsavedData() {
  if (recoveryMode || migrationState || !loadedRevision) return;
  try {
    const backup = storageAdapter.createBackup(currentData(), { kind: 'unsaved-recovery', baseRevision: loadedRevision });
    downloadJSON(backup, `taka-koi-gelo-unsaved-${new Date().toISOString().slice(0,10)}.json`);
    showToast('Unsaved copy export started');
  } catch (error) {
    showStorageIssue(error.message);
  }
}

function reloadActiveData() {
  if (recoveryMode || migrationState || !loadedRevision) return;
  if (!confirm('Reload the latest saved data? Export the unsaved copy first if you need these in-memory changes.')) return;
  try {
    const active = storageAdapter.readActive();
    if (!active) throw new Error('No active dataset is available');
    loadEnvelope(active.envelope);
    settingsOpen = false;
    renderMonthBar();
    renderWorkspaceBar();
    if (activeMonth) renderMonth(); else renderEmpty();
  } catch (error) {
    showStorageIssue(error.message);
  }
}

function backupReminderHTML() {
  const last = appSettings.lastBackupAt ? new Date(appSettings.lastBackupAt) : null;
  const overdue = !last || (Date.now() - last.getTime()) > 30 * 24 * 60 * 60 * 1000;
  if (!overdue) return '';
  const label = last ? `Last backup export was ${last.toLocaleDateString()}.` : 'No full backup has been exported yet.';
  return `<div class="backup-banner"><span>⚠ ${label} Verify and keep a copy outside this browser.</span><button class="btn-outline btn-sm" onclick="exportJSON()">Back up</button></div>`;
}

// ─── MONTH BAR ───────────────────────────────────────────────────
function renderMonthBar() {
  const bar = document.getElementById('monthBar');
  const keys = Object.keys(months).sort();
  bar.innerHTML = '';
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'month-chip' + (k===activeMonth?' active':'');
    btn.textContent = months[k].name;
    btn.onclick = () => selectMonth(k);
    bar.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'add-month-btn';
  add.textContent = '+ New Month';
  add.onclick = showNewMonthModal;
  bar.appendChild(add);
}

function renderWorkspaceBar() {
  const bar=document.getElementById('workspaceBar');if(!bar)return;
  bar.replaceChildren();
  const all=document.createElement('button');all.className='workspace-chip'+(activeWorkspaceId==='all'?' active':'');all.textContent='All Workspaces';all.onclick=()=>selectWorkspace('all');bar.appendChild(all);
  workspaces.filter(workspace=>!workspace.archived).forEach(workspace=>{
    const button=document.createElement('button');button.className='workspace-chip'+(workspace.id===activeWorkspaceId?' active':'');button.textContent=workspace.name;button.onclick=()=>selectWorkspace(workspace.id);bar.appendChild(button);
  });
  const add=document.createElement('button');add.className='add-month-btn';add.textContent='+ Workspace';add.onclick=()=>showWorkspaceModal();bar.appendChild(add);
}

async function selectWorkspace(workspaceId){
  if(workspaceId!=='all'&&!workspaces.some(workspace=>workspace.id===workspaceId&&!workspace.archived))return;
  activeWorkspaceId=workspaceId;appSettings.activeWorkspaceId=workspaceId;settingsOpen=false;
  if(workspaceId!=='all'&&activeMonth&&!budgetFor(activeMonth,workspaceId))createWorkspaceBudget(activeMonth,workspaceId);
  await saveAll();renderWorkspaceBar();if(activeMonth)renderMonth();else renderEmpty();
}

async function selectMonth(key) {
  activeMonth = key;
  storedActiveMonth = key;
  settingsOpen = false;
  if(activeWorkspaceId!=='all'&&!budgetFor(key,activeWorkspaceId))createWorkspaceBudget(key,activeWorkspaceId);
  await saveAll();
  renderMonthBar();
  renderMonth();
}

// ─── NEW MONTH MODAL ─────────────────────────────────────────────
function showNewMonthModal() {
  const d = new Date();
  document.getElementById('newMonthInput').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  updateNewMonthNote();
  document.getElementById('newMonthModal').classList.add('show');
}
document.getElementById('newMonthInput').addEventListener('change', updateNewMonthNote);
function updateNewMonthNote() {
  const val = document.getElementById('newMonthInput').value;
  const note = document.getElementById('newMonthNote');
  if (!val) { note.textContent=''; return; }
  note.textContent = 'Each workspace copies its latest earlier budget, or its own template when none exists.';
}
async function createMonth() {
  const val = document.getElementById('newMonthInput').value;
  if (!val) { showToast('Pick a month'); return; }
  if (months[val]) { showToast('Month already exists'); closeModal('newMonthModal'); selectMonth(val); return; }
  const [yr,mo] = val.split('-').map(Number);
  const name = new Date(yr,mo-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  months[val] = { name, budgets: {} };
  workspaces.filter(workspace=>!workspace.archived).forEach(workspace=>{
    const earlier=Object.keys(months).filter(key=>key<val&&months[key].budgets?.[workspace.id]).sort();
    const source=earlier.length?months[earlier[earlier.length-1]].budgets[workspace.id].categories:workspace.template;
    months[val].budgets[workspace.id]={categories:deepCopy(source.filter(category=>!category.archived)),expenses:[]};
  });
  await saveAll();
  closeModal('newMonthModal');
  renderMonthBar();
  await selectMonth(val);
  showToast(`${name} created ✓`);
}

// ─── MONTH RENDER ────────────────────────────────────────────────
function renderAllWorkspaces(){
  const month=months[activeMonth];if(!month)return;
  document.getElementById('headerTitle').textContent=month.name;
  const rows=workspaces.map(workspace=>{
    const budget=budgetFor(activeMonth,workspace.id);if(!budget)return null;
    const planned=budget.categories.reduce((sum,category)=>sum+category.budget,0);
    const spent=budget.expenses.reduce((sum,expense)=>sum+expense.amt,0);
    return {workspace,planned,spent,count:budget.expenses.length};
  }).filter(Boolean);
  const planned=rows.reduce((sum,row)=>sum+row.planned,0);const spent=rows.reduce((sum,row)=>sum+row.spent,0);
  document.getElementById('headerSub').textContent=`All workspaces · ${fmt(spent)} spent`;
  document.getElementById('mainContent').innerHTML=`${backupReminderHTML()}
    <div class="hero"><div class="hero-label">Combined remaining</div><div class="hero-amount ${spent>planned?'danger':'safe'}">${fmt(planned-spent)}</div><div class="hero-sub">${fmt(spent)} spent of ${fmt(planned)} · ${rows.reduce((sum,row)=>sum+row.count,0)} transactions</div></div>
    <div class="sec-label">Workspace overview</div>
    ${rows.map(row=>`<div class="workspace-card"><div class="workspace-card-head"><div class="workspace-card-name">${h(row.workspace.name)}${row.workspace.archived?'<span class="archived-badge">Archived</span>':''}</div><div class="cat-spent">${fmt(row.spent)}</div></div><div class="workspace-card-meta">${fmt(row.planned)} planned · ${row.count} transactions · ${fmt(row.planned-row.spent)} remaining</div></div>`).join('')||'<div class="empty-state">No workspace budgets in this month.</div>'}`;
}

function renderMonth() {
  const month = months[activeMonth];
  if (!month) return;
  if(activeWorkspaceId==='all'){renderAllWorkspaces();return;}
  const m = currentBudget()||{categories:[],expenses:[]};
  document.getElementById('headerTitle').textContent = `${month.name} · ${selectedWorkspace()?.name||''}`;
  const totalBudget = m.categories.reduce((s,c)=>s+c.budget,0);
  document.getElementById('headerSub').textContent = `Budget: ${fmt(totalBudget)}`;

  const content = document.getElementById('mainContent');
  content.innerHTML = `
    ${backupReminderHTML()}
    <div class="alert-banner" id="alertBanner"></div>
    <div class="hero">
      <div class="hero-label">Remaining Balance</div>
      <div class="hero-amount" id="heroAmt"></div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-bar-bg"><div class="hero-bar" id="heroBar"></div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="sc-label">Spent</div><div class="sc-val red" id="stSpent"></div><div class="sc-sub" id="stSpentSub"></div></div>
      <div class="stat-card"><div class="sc-label">Daily Avg</div><div class="sc-val amber" id="stDaily"></div><div class="sc-sub" id="stDailySub"></div></div>
      <div class="stat-card"><div class="sc-label">Days Left</div><div class="sc-val accent" id="stDaysLeft"></div><div class="sc-sub" id="stDaysLeftSub"></div></div>
      <div class="stat-card"><div class="sc-label">Needed/Day</div><div class="sc-val" id="stNeeded"></div><div class="sc-sub" id="stNeededSub"></div></div>
    </div>
    <div class="tabs">
      <button class="tab" onclick="switchTab('add')">Add</button>
      <button class="tab" onclick="switchTab('cats')">Categories</button>
      <button class="tab" onclick="switchTab('analytics')">Analytics</button>
      <button class="tab" onclick="switchTab('history')">History</button>
      <button class="tab" onclick="switchTab('log')">Log</button>
    </div>
    <div class="tab-panel" id="tab-add">
      <div class="sec-label">Record an expense</div>
      <div class="add-form">
        <div class="frow"><select id="catSel"><option value="">Select category…</option></select></div>
        <div class="frow"><input type="text" id="descIn" placeholder="What did you spend on?" /></div>
        <div class="frow"><input type="date" id="dateIn" min="${h(activeMonth)}-01" max="${h(activeMonth)}-${String(new Date(Number(activeMonth.slice(0,4)),Number(activeMonth.slice(5,7)),0).getDate()).padStart(2,'0')}" /></div>
        <div class="frow">
          <input type="number" id="amtIn" placeholder="Amount (BDT)" min="0.01" step="any" />
          <button class="btn" onclick="addExpense()">Add</button>
        </div>
      </div>
    </div>
    <div class="tab-panel" id="tab-cats"><div class="cat-list" id="catList"></div></div>
    <div class="tab-panel" id="tab-analytics"><div class="ana-grid" id="anaGrid"></div></div>
    <div class="tab-panel" id="tab-history"><div id="histContent"></div></div>
    <div class="tab-panel" id="tab-log">
      <div class="sec-label" style="display:flex;align-items:center;justify-content:space-between">
        <span>All expenses</span>
        <input type="text" id="searchIn" placeholder="Search…" style="width:120px;padding:5px 10px;font-size:12px" oninput="renderLog()" />
      </div>
      <div id="logList"></div>
      <div class="danger-zone">
        <p>Move all ${h(selectedWorkspace()?.name||'workspace')} expenses for ${h(month.name)} to recoverable trash.</p>
        <button class="btn-danger" onclick="clearMonth()">Clear workspace expenses</button>
      </div>
    </div>
  `;

  // Set active tab
  switchTab(currentTab, false);
  populateCatSelect();
  const dateInput = document.getElementById('dateIn');
  if (dateInput) dateInput.value = defaultDateForMonth(activeMonth);
  updateStats();
}

// ─── TABS ────────────────────────────────────────────────────────
function switchTab(name, save=true) {
  if (save) currentTab = name;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', ['add','cats','analytics','history','log'][i]===name);
  });
  document.querySelectorAll('.tab-panel').forEach(p=>{
    p.classList.toggle('active', p.id==='tab-'+name);
  });
  if (name==='cats') renderCats();
  if (name==='analytics') renderAnalytics();
  if (name==='history') renderHistory();
  if (name==='log') renderLog();
}

let settingsOpen = false;
function switchMainTab(name) {
  if (migrationState || recoveryMode) return;
  if (name==='settings') {
    settingsOpen = !settingsOpen;
    if (settingsOpen) renderSettings();
    else if (activeMonth) renderMonth();
    else renderEmpty();
  }
}

// ─── STATS ───────────────────────────────────────────────────────
function updateStats() {
  const m = currentBudget();
  if (!m) return;
  const totalBudget = m.categories.reduce((s,c)=>s+c.budget,0);
  const totalSpent  = m.expenses.reduce((s,e)=>s+e.amt,0);
  const remaining   = totalBudget - totalSpent;
  const pct         = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;
  const isOverBudget = remaining < 0;

  // Days calc
  const [yr,mo] = activeMonth.split('-').map(Number);
  const daysInMonth = new Date(yr,mo,0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===yr && today.getMonth()+1===mo;
  const daysPassed  = isCurrentMonth ? today.getDate() : daysInMonth;
  const daysLeft    = isCurrentMonth ? daysInMonth - today.getDate() : 0;
  const dailyAvg    = daysPassed>0 ? totalSpent/daysPassed : 0;
  const neededPerDay= daysLeft>0 ? remaining/daysLeft : 0;

  // Alert
  const banner = document.getElementById('alertBanner');
  if (banner) {
    if (isOverBudget) {
      banner.textContent = `🚨 Over budget by ${fmt(Math.abs(remaining))}! No daily spending room left.`;
      banner.classList.add('show');
    } else if (remaining < totalBudget*0.1 && daysLeft>0) {
      banner.textContent = `⚠️ Only ${fmt(remaining)} left for ${daysLeft} days — ${fmt(neededPerDay)}/day needed`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  const heroAmt = document.getElementById('heroAmt');
  if (!heroAmt) return;
  heroAmt.textContent = fmt(remaining);
  heroAmt.className = 'hero-amount '+(pct<60?'safe':pct<85?'warn':'danger');
  document.getElementById('heroSub').textContent = `${fmt(totalSpent)} spent of ${fmt(totalBudget)}${isOverBudget ? ` (${fmt(Math.abs(remaining))} over)` : ''}`;
  const bar = document.getElementById('heroBar');
  bar.style.width = Math.min(pct, 100)+'%';
  bar.style.background = pct<60?'var(--green)':pct<85?'var(--amber)':'var(--red)';

  document.getElementById('stSpent').textContent = fmt(totalSpent);
  document.getElementById('stSpentSub').textContent = totalBudget > 0 ? pct.toFixed(1)+'% of budget' : 'No budget set';
  document.getElementById('stDaily').textContent = fmt(dailyAvg);
  document.getElementById('stDailySub').textContent = 'avg over '+daysPassed+' days';
  document.getElementById('stDaysLeft').textContent = daysLeft;
  document.getElementById('stDaysLeftSub').textContent = isCurrentMonth?'days remaining':'month ended';
  const ndEl = document.getElementById('stNeeded');
  if (daysLeft > 0) {
    if (isOverBudget) {
      ndEl.textContent = '৳0';
      ndEl.className = 'sc-val red';
      document.getElementById('stNeededSub').textContent = 'over budget';
    } else {
      ndEl.textContent = fmt(neededPerDay);
      ndEl.className = 'sc-val '+(neededPerDay<1000?'green':neededPerDay<1500?'amber':'red');
      document.getElementById('stNeededSub').textContent = 'to stay on track';
    }
  } else {
    ndEl.textContent = '—';
    ndEl.className = 'sc-val';
    document.getElementById('stNeededSub').textContent = isCurrentMonth ? 'last day' : 'month ended';
  }
}

// ─── CAT SELECT ──────────────────────────────────────────────────
function populateCatSelect() {
  const sel = document.getElementById('catSel');
  if (!sel) return;
  const m = currentBudget(); if(!m)return;
  sel.innerHTML = '<option value="">Select category…</option>';
  m.categories.forEach((c,index)=>{
    if (c.archived) return;
    const o = document.createElement('option');
    o.value = String(index);
    o.textContent = c.name;
    sel.appendChild(o);
  });
}

function defaultDateForMonth(monthKey) {
  const today = new Date();
  const localToday = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  return localToday.slice(0,7) === monthKey ? localToday : `${monthKey}-01`;
}

// ─── ADD EXPENSE ─────────────────────────────────────────────────
async function addExpense() {
  const m = currentBudget(); if(!m||activeWorkspaceId==='all') return;
  const catValue = document.getElementById('catSel').value;
  const catIndex = catValue === '' ? NaN : Number(catValue);
  const desc  = document.getElementById('descIn').value.trim();
  const amt   = parseFloat(document.getElementById('amtIn').value);
  const date  = document.getElementById('dateIn').value;
  const cat   = Number.isInteger(catIndex) ? m.categories[catIndex] : null;
  if (!cat || cat.archived) { showToast('Pick an active category'); return; }
  if (!desc)      { showToast('Describe the expense'); return; }
  if (!Number.isFinite(amt)||amt<=0){ showToast('Enter a finite positive amount'); return; }
  if (!BudgetStorage.isCalendarDate(date) || date.slice(0,7)!==activeMonth) { showToast('Pick a date in this month'); return; }
  m.expenses.unshift({id:uid().replace(/^c/,'e'),catId:cat.id,cat:cat.name,desc,amt,date});
  await saveAll(); updateStats();
  if (currentTab==='cats') renderCats();
  if (currentTab==='log') renderLog();
  document.getElementById('catSel').value='';
  document.getElementById('descIn').value='';
  document.getElementById('amtIn').value='';
  document.getElementById('dateIn').value=defaultDateForMonth(activeMonth);
  showToast('Added ✓');
}

async function deleteExpenseAt(index) {
  const m = currentBudget(); if(!m) return;
  if (!Number.isInteger(index) || index < 0 || index >= m.expenses.length) return;
  if (!confirm('Delete this expense?')) return;
  const [expense] = m.expenses.splice(index,1);
  const trashId = `trash-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  appSettings.transactionTrash.unshift({ id:trashId, sourceMonth:activeMonth, sourceWorkspaceId:activeWorkspaceId, sourceIndex:index, deletedAt:new Date().toISOString(), expense });
  await saveAll(); updateStats();
  if (currentTab==='cats') renderCats();
  if (currentTab==='log') renderLog();
  showUndoToast('Moved to trash', trashId);
}

async function clearMonth() {
  const m = currentBudget(); if(!m) return;
  if (!m.expenses.length) { showToast('No expenses to clear'); return; }
  if (!confirm(`Move all expenses for ${m.name} to recoverable trash?`)) return;
  const deletedAt = new Date().toISOString();
  m.expenses.forEach((expense,index)=>appSettings.transactionTrash.unshift({
    id:`trash-${Date.now()}-${index}-${Math.random().toString(36).slice(2,7)}`,
    sourceMonth:activeMonth, sourceWorkspaceId:activeWorkspaceId, sourceIndex:index, deletedAt, expense
  }));
  m.expenses = [];
  await saveAll(); updateStats(); renderLog();
  showToast('Moved expenses to trash');
}

function showEditExpense(monthKey,index,workspaceId=activeWorkspaceId) {
  const expense = budgetFor(monthKey,workspaceId)?.expenses[index]; if (!expense) return;
  editingExpense = { sourceMonth:monthKey, sourceWorkspaceId:workspaceId, index, originalCatId:expense.catId, originalCat:expense.cat };
  document.getElementById('editExpenseDesc').value = expense.desc;
  document.getElementById('editExpenseAmount').value = expense.amt;
  document.getElementById('editExpenseDate').value = expense.date || '';
  const workspaceSelect=document.getElementById('editExpenseWorkspace');workspaceSelect.replaceChildren();
  workspaces.filter(workspace=>!workspace.archived||workspace.id===workspaceId).forEach(workspace=>{const option=document.createElement('option');option.value=workspace.id;option.textContent=workspace.name;if(workspace.id===workspaceId)option.selected=true;workspaceSelect.appendChild(option);});
  document.getElementById('editExpenseNote').textContent = expense.dateReview
    ? `${expense.dateReview.reason}. Original value: ${expense.legacyDate || 'empty'}. Choose a verified date to resolve it.` : '';
  refreshEditExpenseCategories();
  document.getElementById('editExpenseModal').classList.add('show');
}

function refreshEditExpenseCategories() {
  if (!editingExpense) return;
  const date = document.getElementById('editExpenseDate').value;
  const monthKey = BudgetStorage.isCalendarDate(date) ? date.slice(0,7) : editingExpense.sourceMonth;
  const workspaceId=document.getElementById('editExpenseWorkspace').value||editingExpense.sourceWorkspaceId;
  const month = months[monthKey];
  const budget=budgetFor(monthKey,workspaceId);
  const select = document.getElementById('editExpenseCategory');
  select.replaceChildren();
  if (!month||!budget) {
    const option = document.createElement('option'); option.value=''; option.textContent='Create the destination month first';
    select.appendChild(option); return;
  }
  budget.categories.forEach((category,index)=>{
    const isOriginal = monthKey===editingExpense.sourceMonth&&workspaceId===editingExpense.sourceWorkspaceId&&String(category.id)===String(editingExpense.originalCatId) && category.name===editingExpense.originalCat;
    if (category.archived && !isOriginal) return;
    const option = document.createElement('option'); option.value=String(index);
    option.textContent = category.name + (category.archived ? ' (archived)' : '');
    if (String(category.id)===String(editingExpense.originalCatId) && category.name===editingExpense.originalCat) option.selected=true;
    select.appendChild(option);
  });
}

async function saveExpenseEdit() {
  if (!editingExpense) return;
  const source = budgetFor(editingExpense.sourceMonth,editingExpense.sourceWorkspaceId);
  const expense = source?.expenses[editingExpense.index]; if (!expense) { showToast('Expense no longer exists'); return; }
  const desc = document.getElementById('editExpenseDesc').value.trim();
  const amount = Number(document.getElementById('editExpenseAmount').value);
  const date = document.getElementById('editExpenseDate').value;
  if (!desc) { showToast('Describe the expense'); return; }
  if (!Number.isFinite(amount) || amount<=0) { showToast('Enter a finite positive amount'); return; }
  if (!BudgetStorage.isCalendarDate(date)) { showToast('Choose a valid full date'); return; }
  const destinationKey = date.slice(0,7);
  const destinationWorkspaceId=document.getElementById('editExpenseWorkspace').value;
  const destinationMonth = months[destinationKey];
  const destination=budgetFor(destinationKey,destinationWorkspaceId);
  if (!destinationMonth||!destination) { showToast('Create the destination month and workspace budget first'); return; }
  const catIndex = Number(document.getElementById('editExpenseCategory').value);
  const category = Number.isInteger(catIndex) ? destination.categories[catIndex] : null;
  if (!category) { showToast('Choose a destination category'); return; }
  const isMove=destinationKey!==editingExpense.sourceMonth||destinationWorkspaceId!==editingExpense.sourceWorkspaceId;
  if (isMove && !confirm(`Move this expense to ${destinationMonth.name} · ${workspaceName(destinationWorkspaceId)}?`)) return;

  expense.desc=desc; expense.amt=amount; expense.date=date; expense.catId=category.id; expense.cat=category.name;
  delete expense.legacyDate; delete expense.dateReview;
  if (isMove) {
    source.expenses.splice(editingExpense.index,1);
    destination.expenses.unshift(expense);
  }
  await saveAll(); closeModal('editExpenseModal'); editingExpense=null;
  updateStats();
  if (currentTab==='cats') renderCats();
  if (currentTab==='analytics') renderAnalytics();
  if (currentTab==='history') renderHistory();
  if (currentTab==='log') renderLog();
  showToast(isMove?'Expense moved ✓':'Expense updated ✓');
}

async function restoreTrashItem(trashId) {
  const index=appSettings.transactionTrash.findIndex(item=>item.id===trashId); if(index<0) return;
  const item=appSettings.transactionTrash[index];
  const month=months[item.sourceMonth];const budget=budgetFor(item.sourceMonth,item.sourceWorkspaceId);
  if(!month||!budget){showToast('Restore the original month and workspace first');return;}
  budget.expenses.splice(Math.min(Math.max(item.sourceIndex,0),budget.expenses.length),0,item.expense);
  appSettings.transactionTrash.splice(index,1);
  await saveAll();
  if(activeMonth===item.sourceMonth&&activeWorkspaceId===item.sourceWorkspaceId){updateStats();if(currentTab==='cats')renderCats();if(currentTab==='log')renderLog();if(currentTab==='analytics')renderAnalytics();}
  if(settingsOpen)renderSettings();
  showToast('Expense restored ✓');
}

// ─── CATEGORIES VIEW ─────────────────────────────────────────────
function expenseMatchesCategory(expense, category, categories) {
  const idMatches = categories.filter(c=>String(c.id)===String(category.id));
  if (idMatches.length > 1) return expense.cat===category.name;
  return String(expense.catId)===String(category.id)||expense.cat===category.name;
}
function catSpent(expenses, category, categories) {
  return expenses.filter(e=>expenseMatchesCategory(e,category,categories)).reduce((s,e)=>s+e.amt,0);
}
function barColor(pct){ return pct<70?'var(--green)':pct<100?'var(--amber)':'var(--red)'; }

function renderCats() {
  const m = currentBudget(); if(!m) return;
  const cl = document.getElementById('catList'); if(!cl) return;
  const wasOpen = new Set([...cl.querySelectorAll('.cat-row.open')].map(r=>r.dataset.catid));
  cl.innerHTML='';

  if (m.categories.length === 0) {
    cl.innerHTML = `
      <div class="empty-state" style="padding:40px 16px">
        <div style="font-size:32px;margin-bottom:12px">🏷️</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:6px">No categories yet</div>
        <div style="margin-bottom:16px;color:var(--muted);font-size:13px">Add categories or import them from CSV file/text</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="showAddCatModal(false)">+ Add Category</button>
          <button class="btn-outline btn-sm" onclick="showImportCatModal('month')">📥 Import CSV</button>
        </div>
      </div>`;
    return;
  }

  m.categories.forEach((c,ci)=>{
    const spent = catSpent(m.expenses,c,m.categories);
    const p = c.budget>0?Math.min((spent/c.budget)*100,100):0;
    const col = barColor(p);
    const exps = m.expenses.map((e,expenseIndex)=>({e,expenseIndex}))
      .filter(({e})=>expenseMatchesCategory(e,c,m.categories));
    const row = document.createElement('div');
    row.className='cat-row'+(wasOpen.has(String(c.id))?' open':'');
    row.dataset.catid=String(c.id);
    const expHTML = exps.length===0
      ?'<div class="exp-empty">No expenses yet</div>'
      :exps.map(({e,expenseIndex})=>`<div class="exp-item">
        <div><div class="exp-desc">${h(e.desc)}</div><div class="exp-date ${e.dateReview?'date-review':''}">${h(displayExpenseDate(e))}</div></div>
        <div class="exp-r"><span class="exp-amt">${fmt(e.amt)}</span>
        <button class="edit-exp-btn" aria-label="Edit ${h(e.desc)}" onclick="event.stopPropagation();showEditExpense(activeMonth,${expenseIndex})">✏</button>
        <button class="del-btn" onclick="event.stopPropagation();deleteExpenseAt(${expenseIndex})">✕</button></div>
      </div>`).join('');
    row.innerHTML=`
      <div class="cat-head">
        <div class="cat-name">${h(c.name)}${c.archived?'<span class="archived-badge">Archived</span>':''}</div>
        <div class="cat-right"><div class="cat-spent" style="color:${col}">${fmt(spent)}</div><div class="cat-of">of ${fmt(c.budget)}</div></div>
      </div>
      <div class="cat-pbar-bg"><div class="cat-pbar" style="width:${p}%;background:${col}"></div></div>
      <div class="exp-list">${expHTML}</div>`;
    row.addEventListener('click',()=>row.classList.toggle('open'));
    cl.appendChild(row);
  });
}

// ─── ANALYTICS ───────────────────────────────────────────────────
function renderAnalytics() {
  const m = currentBudget(); if(!m) return;
  const grid = document.getElementById('anaGrid'); if(!grid) return;
  const totalBudget = m.categories.reduce((s,c)=>s+c.budget,0);
  const totalSpent  = m.expenses.reduce((s,e)=>s+e.amt,0);
  const budgetSafe  = Math.max(totalBudget, 1);

  // By date
  const byDate={};
  m.expenses.forEach(e=>{ const label=displayExpenseDate(e); byDate[label]=(byDate[label]||0)+e.amt; });
  const dateEntries=Object.entries(byDate).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxDay=dateEntries.reduce((m,d)=>d[1]>m[1]?d:m,['',0]);
  const biggest=m.expenses.reduce((mx,e)=>e.amt>mx.amt?e:mx,{amt:0,desc:'—',cat:'—'});

  // Spark
  const maxAmt=Math.max(...dateEntries.map(d=>d[1]),1);
  const sparkBars=dateEntries.map(([date,amt])=>{
    const height=Math.max((amt/maxAmt)*100,4);
    const col=amt>5000?'var(--red)':amt>2000?'var(--amber)':'var(--accent)';
    return `<div class="spark-bar" style="height:${height}%;background:${col}" data-tip="${h(date)}: ${fmt(amt)}"></div>`;
  }).join('');
  const sparkDates=dateEntries.map(([date])=>`<div class="spark-date">${h(date.slice(8,10)||'?')}</div>`).join('');

  // Bar chart
  const catTotals=m.categories.map((c,i)=>({name:c.name,spent:catSpent(m.expenses,c,m.categories),color:CAT_COLORS[i%CAT_COLORS.length]}))
    .filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent);
  const maxCat=Math.max(...catTotals.map(c=>c.spent),1);
  const barRows=catTotals.map(c=>`
    <div class="bc-row">
      <div class="bc-label" title="${h(c.name)}">${h(c.name.split(' ')[0])}</div>
      <div class="bc-bar-bg"><div class="bc-bar" style="width:${(c.spent/maxCat)*100}%;background:${c.color}"></div></div>
      <div class="bc-val">${fmt(c.spent)}</div>
    </div>`).join('');

  // Over budget
  const overRows=m.categories.map(c=>{
    const spent=catSpent(m.expenses,c,m.categories);
    const diff=spent-c.budget;
    const over=diff>0;
    return `<div class="over-item"><div class="over-name">${h(c.name)}${c.archived?'<span class="archived-badge">Archived</span>':''}</div>
      <span class="over-badge ${over?'over':'good'}">${over?'+'+fmt(diff)+' over':fmt(Math.abs(diff))+' left'}</span></div>`;
  }).join('');

  // Top 5
  const top5=[...m.expenses].sort((a,b)=>b.amt-a.amt).slice(0,5);
  const topRows=top5.map((e,i)=>`
    <div class="top-item">
      <div class="top-rank">${i+1}</div>
      <div class="top-info"><div class="top-desc">${h(e.desc)}</div><div class="top-cat">${h(e.cat)} · ${h(displayExpenseDate(e))}</div></div>
      <div class="top-amt">${fmt(e.amt)}</div>
    </div>`).join('');

  grid.innerHTML=`
    <div class="ana-card"><div class="ana-title">Total Spent</div><div class="ana-val red">${fmt(totalSpent)}</div><div class="ana-sub">${((totalSpent/budgetSafe)*100).toFixed(1)}% of ${fmt(totalBudget)}</div></div>
    <div class="ana-card"><div class="ana-title">Transactions</div><div class="ana-val accent">${m.expenses.length}</div><div class="ana-sub">${m.expenses.length?'avg '+fmt(totalSpent/m.expenses.length)+' each':''}</div></div>
    <div class="ana-card"><div class="ana-title">Highest Day</div><div class="ana-val amber">${fmt(maxDay[1])}</div><div class="ana-sub">${h(maxDay[0]||'—')}</div></div>
    <div class="ana-card"><div class="ana-title">Biggest Spend</div><div class="ana-val">${fmt(biggest.amt)}</div><div class="ana-sub">${h(biggest.desc)}</div></div>
    <div class="ana-card full"><div class="ana-title">Daily Spending</div><div class="spark-wrap">${sparkBars||'<div class="exp-empty">No data</div>'}</div><div class="spark-dates">${sparkDates}</div></div>
    <div class="ana-card full"><div class="ana-title">Category Breakdown</div><div class="bar-chart">${barRows||'<div class="exp-empty">No data</div>'}</div></div>
    <div class="ana-card full"><div class="ana-title">Budget Status</div><div>${overRows}</div></div>
    <div class="ana-card full"><div class="ana-title">Top 5 Expenses</div><div>${topRows||'<div class="exp-empty">No data</div>'}</div></div>`;
}

// ─── HISTORY ─────────────────────────────────────────────────────
function renderHistory() {
  const hc = document.getElementById('histContent'); if(!hc) return;
  const keys = Object.keys(months).sort().reverse();
  if (keys.length===0) { hc.innerHTML='<div class="empty-state">No months recorded yet.</div>'; return; }
  hc.innerHTML = keys.map((k,keyIndex)=>{
    const month=months[k];const m=budgetFor(k,activeWorkspaceId)||{categories:[],expenses:[]};
    const totalBudget=m.categories.reduce((s,c)=>s+c.budget,0);
    const totalSpent=m.expenses.reduce((s,e)=>s+e.amt,0);
    const pct=totalBudget>0?Math.min((totalSpent/totalBudget)*100,100):0;
    const col=pct<60?'var(--green)':pct<85?'var(--amber)':'var(--red)';
    const topCats=[...m.categories].map(c=>({name:c.name,spent:catSpent(m.expenses,c,m.categories)}))
      .filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent).slice(0,4);

function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function dropOn(e,toIdx,scope) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcIdx||dragSrcIdx.scope!==scope||dragSrcIdx.idx===toIdx) return;
  const arr = scope==='global'?templateCategories():currentBudget().categories;

  arr.splice(toIdx,0,item);
  await saveAll();
  if (scope==='global') renderGlobalCatList(); else renderMonthCatList();
  dragSrcIdx=null;
}

function parseCatCSV(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (!lines.length) return [];

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    let delim = ',';
    if (!line.includes(',') && line.includes(';')) delim = ';';
    else if (!line.includes(',') && !line.includes(';') && line.includes('\t')) delim = '\t';

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i+1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === delim && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  }

  const parsed = [];
  lines.forEach((line, index) => {
    const cols = parseCSVLine(line);
    if (!cols.length) return;

    if (index === 0) {
      const firstColLower = cols[0].toLowerCase();
      if (['category', 'categories', 'name', 'cat', 'category name', 'id'].includes(firstColLower)) {
        return;
      }
    }

    let catName = '';
    let budgetVal = 0;

    if (cols.length >= 3 && !isNaN(parseFloat(cols[2].replace(/[^0-9.-]/g, '')))) {
      catName = cols[1];
      budgetVal = parseFloat(cols[2].replace(/[^0-9.-]/g, '')) || 0;
    } else if (cols.length >= 2) {
      catName = cols[0];
      budgetVal = parseFloat(cols[1].replace(/[^0-9.-]/g, '')) || 0;
    } else {
      catName = cols[0];
      budgetVal = 0;
    }

    catName = catName.replace(/^["']|["']$/g, '').trim();
    if (catName) {
      parsed.push({ name: catName, budget: Math.max(0, budgetVal) });
    }
  });

  return parsed;
}

async function processCatImport() {
  const target = document.getElementById('importCatTarget').value;
  if (target === 'month' && !activeMonth) {
    showToast('No active month selected');
    return;
  }

  const rawText = document.getElementById('importCatText').value;
  const items = parseCatCSV(rawText);
  if (!items.length) {
    showToast('No valid categories found in CSV');
    return;
  }

  const mode = document.querySelector('input[name="importCatMode"]:checked')?.value || 'append';
  const targetArray = target === 'global' ? templateCategories() : currentBudget().categories;

  if (mode === 'replace') {
    try {
      storageAdapter.snapshotCurrent(`before-${target}-category-replace`);
    } catch (error) {
      showStorageIssue(error.message);
      return;
    }
    if(target==='month'){
      const retained=targetArray.filter(category=>currentBudget().expenses.some(expense=>expenseMatchesCategory(expense,category,targetArray)));
      retained.forEach(category=>{category.archived=true;});
      targetArray.splice(0,targetArray.length,...retained);
    }else targetArray.length = 0;
  }

  let addedCount = 0;
  let updatedCount = 0;

  items.forEach(item => {
    const existing = targetArray.find(c => c.name.toLowerCase() === item.name.toLowerCase());
    if (existing) {
      existing.archived=false;
      if (item.budget > 0) {
        existing.budget = item.budget;
        updatedCount++;
      }
    } else {
      targetArray.push({
        id: uid(),
        name: item.name,
        budget: item.budget,
        archived: false
      });
      addedCount++;
    }
  });

  await saveAll();
  closeModal('importCatModal');

  if (target === 'global') {
    renderGlobalCatList();
  } else {
    renderMonthCatList();
  }
  if (activeMonth) {
    populateCatSelect();
    updateStats();
    if (currentTab === 'cats') renderCats();
  }

  const scopeLabel = target === 'global' ? `${selectedWorkspace()?.name} Template` : `${months[activeMonth]?.name} · ${selectedWorkspace()?.name}`;
  showToast(`Imported ${addedCount} new, updated ${updatedCount} for ${scopeLabel} ✓`);
}

async function exportJSON() {
  try {
    const backup = storageAdapter.createBackup(currentData(), { kind: 'full-backup', revision: loadedRevision });
    downloadJSON(backup, `taka-koi-gelo-backup-${new Date().toISOString().slice(0,10)}.json`);
    appSettings.lastBackupAt = new Date().toISOString();
    await saveAll();
    if (settingsOpen) renderSettings();
    showToast('Backup export started — verify the file ✓');
  } catch (error) {
    showStorageIssue(error.message);
  }
}
function importJSON() {
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{
      try {
        pendingRestore = storageAdapter.inspectBackup(ev.target.result);
        showRestorePreview();
      } catch(error){
        pendingRestore = null;
        showStorageIssue(error.message || 'Invalid backup file');
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

function showRestorePreview() {
  const content = document.getElementById('restorePreviewContent');
  content.innerHTML = `<p style="font-size:12px;color:var(--muted2);line-height:1.5">The backup is valid. Review its contents before replacing the current dataset. A recovery snapshot of the current data will be created first.</p>
    ${summaryHTML(pendingRestore.summary)}
    <div style="font-size:11px;color:var(--muted2)">Source schema: ${pendingRestore.sourceVersion === 0 ? 'Legacy (unversioned)' : pendingRestore.sourceVersion}</div>
    <div class="restore-warnings" id="restoreWarnings"></div>`;
  const warnings = pendingRestore.validation.warnings;
  document.getElementById('restoreWarnings').textContent = warnings.length ? `Warnings: ${warnings.join(' · ')}` : 'Validation passed with no warnings.';
  document.getElementById('restorePreviewModal').classList.add('show');
}

function cancelRestorePreview() {
  pendingRestore = null;
  closeModal('restorePreviewModal');
}

async function confirmRestore() {
  if (!pendingRestore) return;
  try {
    const result = recoveryMode
      ? await storageAdapter.restoreDuringRecoveryExclusive(pendingRestore, recoveryState?.rawLegacy, recoveryState?.activePointer)
      : await storageAdapter.restoreExclusive(pendingRestore, loadedRevision);
    pendingRestore = null;
    recoveryMode = false;
    recoveryState = null;
    closeModal('restorePreviewModal');
    loadEnvelope(result.envelope);
    document.getElementById('monthBar').style.display = '';
    document.getElementById('workspaceBar').style.display = '';
    settingsOpen = false;
    renderMonthBar();
    renderWorkspaceBar();
    if (activeMonth) renderMonth(); else renderEmpty();
    showToast('Backup restored and verified ✓');
  } catch (error) {
    showStorageIssue(error.message);
  }
}

async function recoverPoint(encodedKey) {
  if (!confirm('Recover this saved dataset? The current dataset will be preserved as another recovery snapshot first.')) return;
  try {
    const result = await storageAdapter.recoverExclusive(decodeURIComponent(encodedKey), loadedRevision);
    loadEnvelope(result.envelope);
    settingsOpen = false;
    renderMonthBar();
    renderWorkspaceBar();
    if (activeMonth) renderMonth(); else renderEmpty();
    showToast('Recovery point activated ✓');
  } catch (error) {
    showStorageIssue(error.message);
  }
}

function downloadJSON(value,name) {
  const blob = new Blob([JSON.stringify(value,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click();}

async function deleteMonth(key) {
  if (!confirm(`Delete ${months[key]?.name} and all its data?`)) return;
  try { storageAdapter.snapshotCurrent(`before-delete-month-${key}`); }
  catch(error){showStorageIssue(error.message);return;}
  delete months[key];
  if (activeMonth===key) {
    activeMonth=Object.keys(months).sort()[0]||null;
    storedActiveMonth=activeMonth;
  }
  await saveAll(); renderMonthBar(); renderSettings();
  showToast('Month deleted');
}
async function nukeAll() {
  if (!confirm('Delete ALL months and data? This cannot be undone.')) return;
  try { storageAdapter.snapshotCurrent('before-delete-all'); }
  catch(error){showStorageIssue(error.message);return;}
  months={}; activeMonth=null; storedActiveMonth=null;
  await saveAll(); renderMonthBar(); renderEmpty();
  document.getElementById('headerTitle').textContent='Budget Tracker';
  document.getElementById('headerSub').textContent='Select a month';
  showToast('All data cleared');
}

// ─── MODALS ──────────────────────────────────────────────────────
function closeModal(id){
  document.getElementById(id).classList.remove('show');
  if(id==='editExpenseModal')editingExpense=null;
  if(id==='workspaceModal')editingWorkspaceId=null;
}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) closeModal(o.id); });
});

// ─── KEYBOARD ────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if (e.key==='Enter') {
    if(document.querySelector('.modal-overlay.show'))return;
    const addPanel=document.getElementById('tab-add');
    if (addPanel?.classList.contains('active')) addExpense();
  }
  if (e.key==='Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m=>closeModal(m.id));
  }
});

// ─── SERVICE WORKER REGISTRATION & AUTO-UPDATE ────────────────────
window.addEventListener('storage', event => {
  if (event.key !== BudgetStorage.constants.ACTIVE_KEY || !loadedRevision || event.newValue === loadedRevision) return;
  staleDataDetected = true;
  showStorageIssue('A newer dataset was saved in another tab. This tab is now read-only until you export its unsaved copy or reload the latest data.');
});

if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  const registerSW = () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('SW registered:', reg.scope);
        const offerUpdate = worker => {
          if (!worker) return;
          const shouldUpdate = confirm('A new app version is ready. Update now? Save or export any unfinished entry first.');
          if (shouldUpdate) worker.postMessage({type:'SKIP_WAITING'});
        };
        if (reg.waiting) offerUpdate(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const worker = reg.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(worker);
          });
        });
        if (navigator.onLine) {
          reg.update().catch(() => {});
        }
      })
      .catch(err => console.error('SW registration failed:', err));
  };
  if (document.readyState === 'complete') registerSW();
  else window.addEventListener('load', registerSW);
}

init();
</script>
